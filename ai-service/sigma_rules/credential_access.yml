title: Credential Dumping via LSASS
status: stable
description: Detects LSASS memory access for credential dumping
logsource:
    category: process_access
    product: windows
detection:
    selection:
        TargetImage|endswith: '\lsass.exe'
        GrantedAccess|contains:
            - '0x1010'
            - '0x1410'
    condition: selection
level: critical
tags:
    - attack.credential_access
    - attack.t1003.001
