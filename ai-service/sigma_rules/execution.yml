title: Encoded PowerShell Execution
status: stable
description: Detects suspicious encoded PowerShell execution
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\powershell.exe'
        CommandLine|contains:
            - '-enc '
            - '-encodedcommand'
    condition: selection
level: high
tags:
    - attack.execution
    - attack.t1059.001
