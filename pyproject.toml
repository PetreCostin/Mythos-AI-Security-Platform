[tool.poetry]
name = "mythos-ai-security-platform"
version = "0.1.0"
description = "AI-powered cybersecurity platform for detection, intelligence, and automation"
authors = ["Mythos Contributors <team@mythos.local>"]
license = "EPL-2.0"
readme = "README.md"
packages = [{ include = "mythos" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.116.0"
uvicorn = { extras = ["standard"], version = "^0.35.0" }
sqlalchemy = "^2.0.41"
asyncpg = "^0.30.0"
alembic = "^1.16.3"
pydantic = "^2.11.7"
pydantic-settings = "^2.10.1"
scikit-learn = "^1.7.0"
openai = "^1.93.0"
langchain = "^0.3.26"
celery = "^5.5.3"
redis = "^6.2.0"
structlog = "^25.4.0"
pyyaml = "^6.0.2"
cryptography = "^45.0.4"
pyjwt = "^2.10.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
pytest-asyncio = "^1.0.0"
pytest-cov = "^6.2.1"
httpx = "^0.28.1"
ruff = "^0.12.2"
black = "^25.1.0"
mypy = "^1.16.1"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
